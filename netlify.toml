# Configuration de déploiement Netlify pour FlowchatAI
# Le dossier "site/" est la racine publiée (publish directory).

[build]
  publish = "."

# URLs propres : /mentions-legales sert mentions-legales.html
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

# En-têtes de sécurité et de cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/main.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
