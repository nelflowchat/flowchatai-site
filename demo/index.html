<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlez à l'agent · FlowChatAI</title>
<meta name="description" content="L'agent IA de FlowChatAI reprend le fil après un premier échange : il comprend le besoin, vérifie si le moment est bon, et propose un créneau." />

<!-- Page d'atterrissage du QR code de la carte de visite (rencontres BECI, BNI).
     noindex volontaire : elle n'a pas vocation a etre trouvee par un moteur, et
     elle concurrencerait l'accueil sur les memes mots. -->
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0B1F33" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Le widget pese environ 570 Ko et vit sur deux domaines tiers. Ouvrir les
     connexions des le parsing du head fait gagner les allers-retours DNS, TCP
     et TLS, soit plusieurs centaines de ms sur un 4G de salle bondee. -->
<link rel="preconnect" href="https://cdn.voiceflow.com" crossorigin>
<link rel="preconnect" href="https://general-runtime.voiceflow.com" crossorigin>
<link rel="dns-prefetch" href="https://cdn.voiceflow.com">
<link rel="dns-prefetch" href="https://general-runtime.voiceflow.com">

<style>
  /* Memes fichiers que l'accueil, deja en cache pour qui a visite le site. */
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/inter-latin.woff2) format('woff2')}
  @font-face{font-family:'Manrope';font-style:normal;font-weight:700 800;font-display:swap;src:url(/fonts/manrope-latin.woff2) format('woff2')}

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;height:100%}

  /* Fond Night Blue : c'est la face recto de la carte que la personne tient en
     main au moment ou elle scanne. La continuite visuelle fait la moitie de
     l'effet. */
  body{
    margin:0;height:100svh;overflow:hidden;
    background:#0B1F33;color:#E8E6E1;
    font-family:Inter,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 14px);
    gap:14px;
  }

  header{flex:none;max-width:560px;width:100%;margin:0 auto}
  /* La marque est passee dans le H1, qui reprend mot pour mot le titre affiche
     par le widget. Ne reste ici que l'indicateur de disponibilite : dans une
     salle, savoir que ca repond MAINTENANT vaut mieux qu'un second logo. */
  .statut{
    font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#8FA3B5;
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .point{width:8px;height:8px;border-radius:50%;background:#14B8A6;flex:none}

  h1{
    font-family:Manrope,system-ui,sans-serif;font-weight:800;
    font-size:clamp(21px,5.6vw,27px);line-height:1.2;letter-spacing:-.015em;
    color:#F2EFE9;margin:0 0 6px;
  }
  h1 em{font-style:normal;color:#14B8A6}
  p.intro{font-size:14.5px;line-height:1.5;color:#8FA3B5;margin:0}

  /* Le chat EST le contenu : integre, pas une bulle a aller chercher. La
     personne est debout dans une salle, elle ne cherchera rien. */
  #agent{
    flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;
    border-radius:14px;overflow:hidden;background:#F2EFE9;
    box-shadow:0 10px 34px rgba(0,0,0,.3);
    position:relative;
  }
  #agent > *{height:100%}

  .etat{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:26px;font-size:14.5px;line-height:1.6;color:#52606D;
  }
  .etat a{color:#1677FF;font-weight:600}

  footer{
    flex:none;max-width:560px;width:100%;margin:0 auto;
    font-size:12.5px;line-height:1.6;color:#7C8FA1;text-align:center;
  }
  footer a{color:#8FA3B5;text-decoration:none}
  footer strong{color:#B8C4CF;font-weight:600}
</style>
</head>
<body>

<header>
  <div class="statut"><span class="point" aria-hidden="true"></span>En ligne, il reprend le fil tout de suite</div>
  <h1>Agent <em>FlowChatAI</em></h1>
  <!-- La page dit ce que la carte promet, mot pour mot : « du on se rappelle au
       rendez-vous qualifie ». Quelqu'un qui scanne apres une rencontre doit
       retrouver ici la phrase qu'il vient d'entendre, sinon le scan casse
       l'elan au lieu de le prolonger. -->
  <p class="intro">Vous parlez à un agent IA. C'est lui qui reprend le fil après un premier échange, quand la conversation s'arrête sur un « on se rappelle ». Là, il le fait avec vous.</p>
</header>

<div id="agent">
  <div class="etat" id="etat">Chargement de l'agent…</div>
</div>

<!-- Ni nom de famille ni numero personnel : la page est publique et un tel: en
     clair se fait moissonner. La personne tient deja la carte, qui porte les
     coordonnees completes. Ici, l'adresse pro suffit. -->
<footer>
  <a href="mailto:nel@flowchatai.co">nel@flowchatai.co</a> · <a href="https://flowchatai.co/">flowchatai.co</a>
</footer>

<script>
(function(){
  'use strict';

  // Projet Voiceflow "Demo reseautage" : persona PME generique, tous secteurs.
  // Distinct de l'agent du site (698a3a90edb54740de5b5cd5), dont la persona est
  // centree sur l'immobilier et qui tombait a cote devant une salle BNI.
  var PROJET = '6a9848aa9411e200c54bd154';

  var cible = document.getElementById('agent');
  var etat  = document.getElementById('etat');

  // Journal des erreurs reelles. Sans lui, tout echec du widget se traduisait
  // par un ecran "Chargement" muet pendant 30 secondes, puis un message qui
  // accusait le reseau meme quand le reseau n'y etait pour rien. On ne pouvait
  // donc pas distinguer un projet non publie d'un wifi de salle sature.
  var journal = [];
  function noter(source, e){
    var m = (e && (e.message || e.reason && (e.reason.message || e.reason) || e)) || 'inconnu';
    journal.push(source + ' : ' + String(m).slice(0, 200));
  }
  window.addEventListener('error', function(e){ noter('erreur', e); });
  window.addEventListener('unhandledrejection', function(e){ noter('promesse', e); });

  function echec(){
    etat.innerHTML = 'L\'agent ne se charge pas.<br>' +
      'Écrivez-moi plutôt à <a href="mailto:nel@flowchatai.co">nel@flowchatai.co</a>.' +
      '<br><br><span style="font-size:12px;opacity:.75;word-break:break-word">' +
      'Détail technique : ' + (journal.length ? journal.join(' · ') : 'aucune erreur remontée, le widget n\'a jamais répondu') +
      '</span>';
  }

  var s = document.createElement('script');
  s.async = true;
  s.type = 'text/javascript';
  s.onload = function(){
    try {
      // Mode "embedded" et non la bulle flottante : en popup, open() est
      // appele avant que le widget soit monte, il ne fait rien, et l'accroche
      // Voiceflow vient recouvrir le pied de page. Integre, la conversation
      // est simplement la, deja ouverte.
      // load() renvoie une promesse dans widget-next. Sans ce .catch, un projet
      // non publie ou un identifiant errone echouait sans rien afficher.
      var chargement = window.voiceflow.chat.load({
        verify: { projectID: PROJET },
        url: 'https://general-runtime.voiceflow.com',
        versionID: 'production',
        voice: { url: 'https://runtime-api.voiceflow.com' },
        autostart: true,
        // Un identifiant neuf a chaque ouverture. Sans lui, Voiceflow reprend
        // la session gardee dans le stockage local du navigateur : on retombe
        // sur une conversation deja terminee ("Chat has ended"), ou pire, sur
        // celle de l'ancien agent immo. Une demo doit repartir de zero a
        // chaque scan, c'est tout l'effet recherche.
        userID: 'demo-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10),
        render: { mode: 'embedded', target: cible }
      });
      // Voiceflow rend le chat dans un SHADOW DOM attache a la cible, pas en
      // enfants classiques. Compter cible.children reste donc a 1 pour
      // toujours, et l'ancien test declenchait le message d'echec a chaque
      // chargement, y compris quand tout marchait. On interroge le shadowRoot.
      //
      // Effet de bord utile : des qu'un shadowRoot existe sans <slot>, le
      // navigateur cesse d'afficher les enfants classiques. Le message
      // d'attente disparait donc tout seul, on le retire par proprete.
      if (chargement && typeof chargement.catch === 'function') {
        chargement.catch(function(e){ noter('load', e); echec(); });
      }
      var essais = 0;
      var t = setInterval(function(){
        if (cible.shadowRoot && cible.shadowRoot.childElementCount > 0) {
          etat.remove(); clearInterval(t); return;
        }
        essais++;
        // 570 Ko sur le 4G d'une salle bondee prennent du temps. On patiente
        // 30 s avant d'annoncer un echec : annoncer trop tot est pire que
        // faire attendre, la personne abandonne alors que ca arrivait.
        // Au bout de 8 s on rassure quand meme, un texte fige passe pour un plantage.
        if (essais === 80) { etat.textContent = 'Toujours en cours, la connexion est lente…'; }
        else if (essais > 300) { clearInterval(t); echec(); }
      }, 100);
    } catch (e) { echec(); }
  };
  s.onerror = echec;
  s.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
  document.head.appendChild(s);
})();
</script>

</body>
</html>
